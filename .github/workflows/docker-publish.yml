name: docker-publish

# 触发时机：
#   - push 到 main          → 构建并推送 latest + sha-<commit>（每次提交都有可追溯镜像）
#   - push v* tag（如 v1.2.3）→ 额外推送 v1.2.3 / 1.2 / 1 / latest 语义化标签
#   - pull_request          → 只构建不推送（用来验 Dockerfile 没被改坏）
#   - 手动 workflow_dispatch → 可在 Actions 页面按需构建
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

# 同一分支/标签上并发构建时，取消旧的那次，避免两个构建抢推同一个 tag。
concurrency:
  group: docker-publish-${{ github.ref }}
  cancel-in-progress: true

env:
  # ghcr.io 要求仓库名全小写，而 GitHub 仓库名是 Herder1/potato-text（含大写），
  # 所以这里显式写死小写路径，不要换成 ${{ github.repository }}。
  IMAGE_NAME: ghcr.io/herder1/potato-text
  # 默认只构建 amd64。需要 ARM（Apple Silicon / ARM VPS）时改成 "linux/amd64,linux/arm64"，
  # 注意 arm64 在本机 runner 上要走 QEMU 模拟，构建时间会明显变长。
  PLATFORMS: linux/amd64

jobs:
  # 单元测试。刻意不设为 docker 的依赖项、且 continue-on-error：
  # 镜像发布不应被"测试环境与生产镜像的差异"堵死：这里只保证测试结果可见
  # （失败会以 error 注解挂到本次 commit 的 check run 上），不保证它一定绿。
  # 想把它变成发布门禁：删掉 continue-on-error 并给 docker 加 needs: test。
  test:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      # 试卷 PDF 导出（apps/api/src/render-exam-pdf.py）依赖 python3 + reportlab + CJK 字体，
      # runner 默认没有。两个字体包都必须装：Noto Sans CJK 是 OTTO(CFF/PostScript) 轮廓，
      # reportlab 的 TTFont 只支持 TrueType，真正能被嵌入的是 fonts-wqy-zenhei（TrueType）。
      # 这里装的正是 Dockerfile 运行层那几个包 —— 保持"CI 测到的 = 镜像里跑的"。
      - name: Install exam PDF renderer deps
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends python3 python3-reportlab fonts-noto-cjk fonts-wqy-zenhei
      - name: Report renderer environment
        run: |
          python3 -c "import sys, reportlab; print('python', sys.version.split()[0], '| reportlab', reportlab.Version)"
          ls -1 /usr/share/fonts/truetype/wqy/ /usr/share/fonts/opentype/noto/ 2>/dev/null || true
          node -e "const fs=require('fs');const p='apps/api/src/render-exam-pdf.py';console.log('render script bytes', fs.statSync(p).size)"
          python3 -c "import importlib.util;spec=importlib.util.spec_from_file_location('r','apps/api/src/render-exam-pdf.py');m=importlib.util.module_from_spec(spec);spec.loader.exec_module(m);print('picked CJK font:', m.register_font())" || echo "FONT PROBE FAILED (见上一行异常)"
      - run: npm ci --no-audit --no-fund
      # 测试失败时把失败用例与错误码以 ::error:: 注解挂到本次 commit 的 check run 上，
      # 这样红叉点进去就能看到"哪几个用例挂了、挂在哪一行"，不必翻整个日志。
      - name: Run tests
        run: |
          set +e
          npm test 2>&1 | tee /tmp/npm-test.log
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            grep -E "^not ok |^ +error:|^ +code:|Error:" /tmp/npm-test.log | head -n 10 | while IFS= read -r line; do
              echo "::error::$(printf '%s' "$line" | cut -c1-800)"
            done
          fi
          exit $status

  docker:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute image tags and labels
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=ref,event=tag
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=sha,format=long,prefix=sha-
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: ${{ env.PLATFORMS }}
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: false
